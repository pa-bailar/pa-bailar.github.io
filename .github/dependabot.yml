# Weekly dependency updates, one grouped PR per ecosystem. CI runs on each; merge when green.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # @astrojs/check 0.9 doesn't support TypeScript 7 (the grouped update failed ci): bump it by hand once it does.
      - dependency-name: "typescript"
        versions: [">=7"]
      # Node's types follow the Node version the site runs on (.nvmrc, 24): a new major comes with a new Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
