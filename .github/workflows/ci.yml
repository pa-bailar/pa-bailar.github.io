# The `ci` check required on main: data format check, type check (strict) + color contrast, unit tests
# (Vitest), and build.
# Runs on every pull request, including the daily data PRs opened by the pa-bailar-bot GitHub App
# from the (private) backend repository.
name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Data format, type check and color contrast
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
