# The `ci` check required on main: data format check, type check (strict), color contrast and CSS custom
# properties, unit tests (Vitest), and build. On pull requests, also the title: it becomes the commit on main
# (squash merge), whose Conventional Commits type sets the next version (frontend/scripts/release.mjs).
# Runs on every pull request, including the data PRs opened by the pa-bailar-bot GitHub App
# from the backend repository (pa-bailar/backend).
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited] # edited: a fixed title
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: PR title (Conventional Commits)
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/release.mjs check "$TITLE"
      # The images live in their own repository (pa-bailar/media): copied into data/ before anything reads it.
      - name: Check out the images
        uses: actions/checkout@v7
        with:
          repository: pa-bailar/media
          path: .media
          persist-credentials: false
          sparse-checkout: | # not archive/: it grows for good and the site never publishes it
            flyers
            previews
      # A folder can be missing (git keeps no empty folder: no clips left once the last video's event is past).
      - name: Copy the images into data/
        working-directory: .
        run: |
          for folder in flyers previews; do
            mkdir -p "data/$folder"
            if [ -d ".media/$folder" ]; then cp -r ".media/$folder/." "data/$folder/"; fi
          done
      - run: npm ci
      - name: Data format, type check, color contrast and CSS properties
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
