# The `ci` check required on main: data format check, type check (strict), color contrast and CSS custom
# properties, unit tests (Vitest; not on a PR that changes only data/), and build. On pull requests, also the title: it becomes the commit on main
# (squash merge), whose Conventional Commits type sets the next version (frontend/scripts/release.mjs).
# Runs on every pull request, including the data PRs opened by the pa-bailar-bot GitHub App
# from the backend repository (pa-bailar/backend).
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited] # edited: a fixed title
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # the PR's merge commit and main's: what the PR changes (below)
      # A PR that changes only data/ (the sweeps' data PRs) skips the unit tests: they test the code, which it leaves
      # as it is, and none reads data/. The data check, the type check and the build still run. A test that broke with
      # the calendar blocked every sweep's data on 2–3 Nov 2026; now it fails on the next code PR instead.
      - name: What the PR changes
        id: changes
        if: github.event_name == 'pull_request'
        working-directory: .
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qv '^data/'; then data_only=false; else data_only=true; fi
          echo "data_only=$data_only" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: PR title (Conventional Commits)
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/release.mjs check "$TITLE"
      # The images live in their own repository (pa-bailar/media): copied into data/ before anything reads it.
      - name: Check out the images
        uses: actions/checkout@v7
        with:
          repository: pa-bailar/media
          path: .media
          persist-credentials: false
          sparse-checkout: | # not archive/: it grows for good and the site never publishes it
            flyers
            previews
      # A folder can be missing (git keeps no empty folder: no clips left once the last video's event is past).
      - name: Copy the images into data/
        working-directory: .
        run: |
          for folder in flyers previews; do
            mkdir -p "data/$folder"
            if [ -d ".media/$folder" ]; then cp -r ".media/$folder/." "data/$folder/"; fi
          done
      - run: npm ci
      - name: Data format, type check, color contrast and CSS properties
        run: npm run check
      - name: Unit tests
        if: steps.changes.outputs.data_only != 'true'
        run: npm test
      # Again, a week, a month and months ahead on a Saturday night: a test that passes only on today's date fails on
      # its own PR, not later on another PR (two blocked the sweeps' data PRs, 10–17 Oct 2026, and one 2–3 Nov).
      - name: Unit tests with the clock ahead
        if: steps.changes.outputs.data_only != 'true'
        run: npm run test:clock-ahead
      - name: Build
        run: npm run build
