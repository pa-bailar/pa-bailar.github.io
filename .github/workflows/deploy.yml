# Builds the Astro site and publishes it to GitHub Pages.
# Runs on every push to main (merged PRs, including the data PRs), from the manual button, and from the
# backend's sweep (twice a day, 9 AM and 9 PM Bogotá) when it changed nothing, passing the time of its
# check so "Actualizado el …" stays current even without new events.
# Before building, it works out the site's version from the PRs merged since the last one
# (frontend/scripts/release.mjs): when they change the site, it tags the new version and publishes a GitHub
# Release listing the changes. The footer shows the version, linked to that release.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      checked_at:
        description: "When the data was last checked (ISO time); defaults to meta.json's generated_at"
        required: false

# Least privilege: the build (which runs npm install scripts) only reads; only the deploy job can publish.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Only git and gh here: nothing installed from npm runs with write access.
  version:
    permissions:
      contents: write # the tag and the release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the history and tags since the last version
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Work out the version
        id: plan
        run: node frontend/scripts/release.mjs plan "$RUNNER_TEMP/notes.md" | tee -a "$GITHUB_OUTPUT"
      - name: Tag and publish the release
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"

  build:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          PUBLIC_CHECKED_AT: ${{ inputs.checked_at }}
          PUBLIC_VERSION: ${{ needs.version.outputs.version }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
