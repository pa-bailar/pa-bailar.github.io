# Builds the Astro site and publishes it to GitHub Pages.
# Runs on every push to main (merged PRs, including the data PRs), from the manual button, and from the
# backend's sweep (twice a day, 9 AM and 9 PM Bogotá) when it changed nothing, passing the time of its
# check so "Actualizado el …" stays current even without new events.
# Before building, it works out the site's version from the PRs merged since the last one
# (frontend/scripts/release.mjs). Only once the site is live, when they change it, it tags the new version and
# publishes a GitHub Release listing the changes: a failed build or deploy publishes nothing, and the next run
# works out the same version again. The footer shows the version, linked to that release.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      checked_at:
        description: "When the data was last checked (ISO time); defaults to meta.json's generated_at"
        required: false

# Least privilege: everything reads only; the deploy job can publish the site, the release job the tag and release.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Only git here: the version and the release notes for HEAD.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the history and tags since the last version
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Work out the version
        id: plan
        run: node frontend/scripts/release.mjs plan "$RUNNER_TEMP/notes.md" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: steps.plan.outputs.release == 'true'
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes.md
          retention-days: 1

  build:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The images live in their own repository (pa-bailar/media): copied into data/ before anything reads it.
      - name: Check out the images
        uses: actions/checkout@v7
        with:
          repository: pa-bailar/media
          path: .media
          persist-credentials: false
          sparse-checkout: | # not archive/: it grows for good and the site never publishes it
            flyers
            previews
      # A folder can be missing (git keeps no empty folder: no clips left once the last video's event is past).
      - name: Copy the images into data/
        working-directory: .
        run: |
          for folder in flyers previews; do
            mkdir -p "data/$folder"
            if [ -d ".media/$folder" ]; then cp -r ".media/$folder/." "data/$folder/"; fi
          done
      - run: npm ci
      - name: Data format, type check, color contrast and CSS properties
        run: npm run check
      - run: npm run build
        env:
          PUBLIC_CHECKED_AT: ${{ inputs.checked_at }}
          PUBLIC_VERSION: ${{ needs.version.outputs.version }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # After the site is live: the tag and the release (gh only: nothing installed from npm runs with write access).
  release:
    needs: [version, deploy]
    if: needs.version.outputs.release == 'true'
    permissions:
      contents: write # the tag and the release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: ${{ runner.temp }}
      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
